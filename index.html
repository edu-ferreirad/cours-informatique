<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portail Pédagogique</title>
    <style>
        /* STYLE DE BASE */
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; height: 100vh; background-color: black; overflow-x: hidden; }
        h1 { color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        p { color: #f0f0f0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        .btn { display: inline-block; padding: 15px 30px; margin: 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-size: 18px; position: relative; z-index: 10; box-shadow: 0 0 10px #007bff; }
        .btn:hover { background-color: #0056b3; }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
    </style>
</head>
<body>

    <!-- Animation Matrix -->
    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <!-- Contenu de votre page -->
        <h1 style="margin-top: 60px;">Bienvenue sur le Portail Pédagogique</h1>
        <p>Sélectionnez votre cursus :</p>
        
        <div style="margin-top: 30px;">
            <a class="btn" href="cycle-orientation/">Cycle d'Orientation</a>
            <a class="btn" href="college/">Collège</a>
            <a class="btn" href="ECG/">ECG</a>
            <a class="btn" href="DEMO/">Démonstrations en cybersécurité</a>
            <a class="btn" href="PD/">Protection des données</a>
        </div>
    </div>

    <!-- Script pour l'animation Matrix -->
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const katakana = 'アァカサタナハマヤラワガザダバパイィキシチニヒミリヲギジヂビピウゥクスツヌフムユルグズブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨロヲゴゾドボポヴッン';
        const nums = '0123456789';
        const alphabet = katakana + nums;

        const fontSize = 16;
        let columns = canvas.width / fontSize;

        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 30);
    </script>

</body>
</html>
