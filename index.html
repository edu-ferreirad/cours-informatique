<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portail Pédagogique</title>
    <style>
        /* STYLE DE BASE - NE PAS MODIFIER */
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px auto 0 auto; } /* Ajout de auto sur les côtés pour centrer si le body change de largeur */
        h1 { color: #333; }
        .btn { display: inline-block; padding: 15px 30px; margin: 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-size: 18px; position: relative; z-index: 10; } /* z-index pour que les boutons soient au-dessus de l'animation */
        .btn:hover { background-color: #0056b3; }
        p { position: relative; z-index: 10; }

        /* NOUVEAU STYLE POUR L'ANIMATION MATRIX */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: black;
            overflow: hidden; /* Empêche les barres de défilement dues à l'animation */
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* L'animation est derrière le texte */
        }

        /* Pour que le contenu reste visible sur fond noir (titre qui était noir) */
        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Ajout d'une ombre pour la lisibilité */
        }
        p {
            color: #f0f0f0; /* Légèrement gris pour le contraste */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Animation Matrix -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Contenu de votre page -->
    <h1 style="margin-top: 100px;">Bienvenue sur le Portail Pédagogique</h1> <!-- Petite marge pour le descendre un peu -->
    <p>Sélectionnez votre cursus :</p>
    
    <div style="margin-top: 50px;">
        <a class="btn" href="cycle-orientation/">Cycle d'Orientation</a>
        <a class="btn" href="college/">Collège</a>
        <a class="btn" href="ECG/">ECG</a>
        <a class="btn" href="DEMO/">Démonstrations en cybersécurité</a>
        <a class="btn" href="PD/">Protection des données</a>
    </div>

    <!-- Script pour l'animation Matrix -->
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // Réinitialise la taille du canvas quand la fenêtre change de taille
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const katakana = 'アァカサタナハマヤラワガザダバパイィキシチニヒミリヲギジヂビピウゥクスツヌフムユルグズブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const nums = '0123456789';
        const alphabet = katakana + nums;

        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function draw() {
            // Fond noir semi-transparent pour créer l'effet de traînée
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFFFFF'; // Couleur blanche pour les caractères
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 30);
    </script>

</body>
</html>
