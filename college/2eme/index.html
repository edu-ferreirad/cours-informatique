<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Collège - 2ème matu</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            margin: 0; 
            padding-top: 50px; 
            background-color: #050001; /* Fond encore plus sombre et profond */
            color: white;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            text-shadow: 0 0 12px #b3002d; /* Rouge foncé/bordeaux pour l'éclat */
        }
        .btn { 
            display: block; 
            width: 240px; 
            margin: 15px auto; 
            padding: 15px; 
            background-color: rgba(15, 0, 3, 0.95); 
            color: #ff8093; /* Rouge-rose plus sourd */
            text-decoration: none; 
            border: 1px solid #990024; /* Bordure rouge bordeaux foncé */
            border-radius: 5px; 
            font-weight: bold;
            transition: all 0.3s;
            position: relative;
            z-index: 10;
        }
        .btn:hover { 
            background-color: #990024; /* Fond bordeaux foncé au survol */
            color: white;
            box-shadow: 0 0 20px #cc0033; /* Lueur rouge intense mais profonde */
        }
        .back-link {
            color: #ff8093;
            text-decoration: none;
            position: relative;
            z-index: 10;
        }
        .back-link:hover {
            color: white;
        }
        #auth-container {
            position: relative;
            z-index: 10;
            margin-top: 50px;
        }
        input[type="password"] {
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(15, 0, 3, 0.95);
            color: #ff8093;
            border: 1px solid #990024;
            border-radius: 5px;
            outline: none;
            width: 220px;
            text-align: center;
        }
        button {
            padding: 10px 15px;
            font-family: 'Courier New', Courier, monospace;
            background-color: #590014; /* Bordeaux très sombre pour le bouton */
            color: white;
            border: 1px solid #990024;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #990024;
            box-shadow: 0 0 12px #cc0033;
        }
        .error-msg {
            color: #ff3344;
            margin-top: 10px;
            font-size: 0.9em;
        }
        #protected-content {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <!-- ZONE DE CONNEXION -->
    <div id="auth-container">
        <h1>Accès Protégé</h1>
        <p>Veuillez entrer le mot de passe pour accéder à l'espace 2ème matu :</p>
        <input type="password" id="password-input" placeholder="Mot de passe">
        <br><br>
        <button onclick="checkPassword()">Valider</button>
        <div id="error" class="error-msg"></div>
        <br><br>
        <a class="back-link" href="../index.html">⬅ Retour à l'accueil général</a>
    </div>

    <!-- CONTENU PROTÉGÉ -->
    <div id="protected-content">
        <h1>2ème matu</h1>
        <p>Choisissez une catégorie :</p>
        
        <a class="btn" href="cours-exercices/">Cours-Exercices</a>
        <a class="btn" href="exercices-en-ligne/">Exercices en ligne</a>
        <a class="btn" href="examens-projets/">Examens-Projets</a>
        <a class="btn" href="jeux/">Jeux</a>
        
        <br><br>
        <a class="back-link" href="../index.html">⬅ Retour à l'accueil général</a>
    </div>

    <script>
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const errorDiv = document.getElementById('error');
            
            if (input === 'motdepasse2m') {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('protected-content').style.display = 'block';
            } else {
                errorDiv.textContent = 'Mot de passe incorrect.';
            }
        }

        // Permettre de valider aussi avec la touche Entrée
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const chars = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 16;
        let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(5, 0, 1, 0.08)'; // Traînée adaptée au nouveau fond sombre
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            
            drops.forEach((drop, i) => {
                // Nuances de rouge plus sombre, bordeaux et blanc tamisé pour la pluie matrix
                const colors = ['#ffe6ea', '#cc3355', '#990024'];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * fontSize, drop * fontSize);
                
                if (drop * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
