<!DOCTYPE html>
<html lang="fr">

    <style>
        body {
            background-color: #090000;
            color: #ff0055;

            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1 {
            text-align: center;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #aa0000;
            border-bottom: 2px dashed #ff0055;
            padding-bottom: 15px;
            letter-spacing: 2px;
            position: relative;
            z-index: 10;
            color: #ffffff;
        }
        h2.section-titre {

            text-shadow: 0 0 8px #ff0055;

            padding-top: 25px;
            position: relative;
            z-index: 10;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(20, 0, 5, 0.85);
            border: 1px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);

        }

        .btn-container {
            display: flex;
            flex-direction: column;

            align-items: center;

        }
        .btn-jdr {
            display: inline-block;
            width: 80%;
            text-align: center;
            background-color: #ff0055;
            color: #090000;
            border: 2px solid #ff5588;
            padding: 14px 28px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            box-shadow: 0 0 15px #ff0055;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-jdr:hover {

            color: #090000;
            border-color: #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 30px #ff0055;
        }
        .back-link {
            text-align: center;
            margin-top: 50px;
            position: relative;
            z-index: 10;
        }
        .back-link a {

        }
        .back-link a:hover {
            color: #ffffff;

        }

        /* --- Section Cours (PDF en prévisualisation + téléchargement) --- */
        .cours-bloc {

        .cours-bloc h3 {

            color: #ffffff;

        }
        .cours-apercu {
            width: 100%;
            height: 480px;
            border: 1px solid #ff3366;
            border-radius: 4px;
            background: #1a1a1a;
        }
        .cours-telecharger {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 0.9em;
            border: 1px solid #ff3366;

        .zip-telecharger {
            display: block;
            text-align: center;
            margin-top: 10px;
            padding: 14px 20px;
            border: 2px dashed #ff5588;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }

        /* Styles pour l'écran de verrouillage du mot de passe */
        #password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 0, 5, 0.95);
            z-index: 1000;
            display: flex;

        .login-box {

            border: 1px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        .login-box h2 {
            color: #ffffff;
            text-shadow: 0 0 10px #ff0055;
            margin-top: 0;
        }
        .login-box input {
            padding: 10px;
            font-size: 1em;
            background: #000;
            border: 1px solid #ff0055;
            color: #ff0055;
            border-radius: 5px;
            margin-top: 15px;
            outline: none;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
        }
        .login-box button {
            padding: 10px 20px;
            margin-top: 15px;
            background-color: #ff0055;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0055;
            display: block;
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
        }
        .login-box button:hover {
            background-color: #ffffff;
            color: #090000;
            box-shadow: 0 0 15px #ff0055;
        }
        #error-msg { color: #ff4444; margin-top: 10px; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

    <div id="password-overlay">
        <div class="login-box">
            <h2>Accès Protégé</h2>
            <input type="password" id="password-input" placeholder="Mot de passe">
            <button onclick="checkPassword()">Valider</button>
            <div id="error-msg">Mot de passe incorrect</div>
        </div>
    </div>

    <canvas id="matrix"></canvas>

    <div class="container" id="main-content" style="display: none;">
        
        <h1>// Serious Game</h1>
        
        <div class="btn-container">
            <a href="BIENVENUE_RECRUE.html" class="btn-jdr">▶ Lancer le Serious Game</a>
        </div>

        <h2 class="section-titre">📚 Cours</h2>

        <div class="cours-bloc">
            <h3>Droit numérique</h3>
            <iframe class="cours-apercu" src="Droit_numérique.pdf" title="Aperçu du cours Droit numérique"></iframe>
            <a class="cours-telecharger" href="Droit_numérique.pdf" download>⬇ Télécharger le PDF — Droit numérique</a>
        </div>

        <div class="cours-bloc">
            <h3>Commandes terminal</h3>
            <iframe class="cours-apercu" src="Cours_de_Terminal.pdf" title="Aperçu du cours Commandes terminal"></iframe>
            <a class="cours-telecharger" href="Cours_de_Terminal.pdf" download>⬇ Télécharger le PDF — Commandes terminal</a>
        </div>

        <a class="zip-telecharger" href="Modele_pour_les_eleves.zip" download>⬇ Télécharger le modèle élève (.zip)</a>

        <div class="back-link">
            <p><a href="../index.html">⬅ Retour à l'accueil général</a></p>
        </div>
    </div>

    <script>
        function checkPassword() {
            if (document.getElementById('password-input').value === 'cfds26') {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        const fontSize = 16;
        let columns;
        let drops = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const nouvellesColonnes = Math.floor(canvas.width / fontSize);

            if (!drops.length) {
                columns = nouvellesColonnes;
                for (let i = 0; i < columns; i++) {
                    drops[i] = 1;
                }
            } else if (nouvellesColonnes > columns) {
                for (let i = columns; i < nouvellesColonnes; i++) {
                    drops[i] = 1;
                }
                columns = nouvellesColonnes;
            } else {
                columns = nouvellesColonnes;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';

        function drawMatrix() {
            ctx.fillStyle = 'rgba(9, 0, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                ctx.fillStyle = ['#ff0055', '#ff3333', '#aa0022', '#ff6688'][Math.floor(Math.random() * 4)];
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
