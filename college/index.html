<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Collège</title>
    <style>
        body { 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            margin: 0; 
            padding-top: 50px; 
            background-color: #090000; 
            color: white;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            text-shadow: 0 0 10px #ff0000;
        }
        .btn { 
            display: block; 
            width: 200px; 
            margin: 15px auto; 
            padding: 15px; 
            background-color: rgba(20, 0, 5, 0.9); 
            color: #ff0055; 
            text-decoration: none; 
            border: 1px solid #ff0055;
            border-radius: 5px; 
            font-weight: bold;
            transition: all 0.3s;
            position: relative;
            z-index: 10;
        }
        .btn:hover { 
            background-color: #ff0055; 
            color: white;
            box-shadow: 0 0 20px #ff0055;
        }
        .back-link {
            color: #ff69b4;
            text-decoration: none;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <h1>Espace Collège</h1>
    <p>Choisissez votre niveau :</p>
    
    <a class="btn" href="1ere/">1ère année</a>
    <a class="btn" href="2eme/">2ème année</a>
    <a class="btn" href="3eme/">3ème année</a>
    <a class="btn" href="4eme/">4ème année</a>
    <a class="btn" href="cours_fac/">Cours fac</a>
    
    <br><br>
    <a class="back-link" href="../index.html">⬅ Retour à l'accueil général</a>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const chars = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 16;
        let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(9, 0, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            
            drops.forEach((drop, i) => {
                // Nuances de rouge : #ff6688 (clair), #ff0055 (moyen), #880022 (foncé)
                const colors = ['#ff6688', '#ff0055', '#880022'];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * fontSize, drop * fontSize);
                
                if (drop * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
