<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Examens - 1ère matu</title>
    <style>
        body {
            background-color: #090000;
            color: #ff9999;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding-top: 80px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding: 40px;
            background: rgba(20, 0, 5, 0.85);
            border: 1px solid #ff6666;
            box-shadow: 0 0 20px rgba(255, 102, 102, 0.3);
            border-radius: 8px;
        }
        h1 {
            color: #ffffff;
            text-shadow: 0 0 10px #ff6666, 0 0 20px #880022;
            margin-bottom: 20px;
        }
        p {
            color: #ff9999;
            font-size: 1.1em;
            text-shadow: 0 0 5px #ff6666;
            margin-bottom: 30px;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #880022;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid #ff6666;
            transition: all 0.3s;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #ff6666;
            box-shadow: 0 0 15px #ff6666;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>Examens</h1>
        <p>Espace réservé aux évaluations et examens de 1ère matu.</p>
        <p style="font-size: 0.9em; color: #ff6666;">Contenu disponible prochainement.</p>
        
        <a class="back-btn" href="../index.html">⬅ Retour au menu</a>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(9, 0, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const colors = ['#ffffff', '#ff9999', '#ff6666'];
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
