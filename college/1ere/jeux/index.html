<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeux - 1ère matu</title>
    <style>
        body {
            background-color: #090000;
            color: #ff9999;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 0 0 10px #ff6666, 0 0 20px #880022;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        .game-card {
            background: rgba(20, 0, 5, 0.85);
            border: 1px solid #ff6666;
            box-shadow: 0 0 15px rgba(255, 102, 102, 0.2);
            border-radius: 8px;
            margin: 25px auto;
            padding: 20px;
            width: 90%;
        }
        .game-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #ff9999;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #ff6666;
        }
        .game-title a {
            color: #ff9999;
            text-decoration: none;
        }
        .game-title a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .iframe-container {
            width: 100%;
            height: 450px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #880022;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #880022;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            position: relative;
            z-index: 10;
            border: 1px solid #ff6666;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background-color: #ff6666;
            box-shadow: 0 0 15px #ff6666;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>Espace Jeux - 1ère matu</h1>
        <p><a class="back-btn" href="index.html">⬅ Retour au menu 1ère matu</a></p>

        <p>Prévisualisation des activités :</p>

        <!-- 1. Mes jeux -->
        <div class="game-card">
            <div class="game-title">🎮 <a href="https://learningapps.org/watch?v=pde90hqct25" target="_blank">Mes jeux (LearningApps)</a></div>
            <div class="iframe-container">
                <iframe src="https://learningapps.org/watch?v=pde90hqct25"></iframe>
            </div>
        </div>

        <!-- 2. Compute It -->
        <div class="game-card">
            <div class="game-title">💻 <a href="http://compute-it.toxicode.fr/" target="_blank">Compute It</a></div>
            <div class="iframe-container">
                <iframe src="http://compute-it.toxicode.fr/"></iframe>
            </div>
        </div>

        <!-- 3. Little Dot -->
        <div class="game-card">
            <div class="game-title">🔴 <a href="https://little-dot.toxicode.fr/" target="_blank">Little Dot</a></div>
            <div class="iframe-container">
                <iframe src="https://little-dot.toxicode.fr/"></iframe>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(9, 0, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const colors = ['#ffffff', '#ff9999', '#ff6666'];
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
