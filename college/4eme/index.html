<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Collège - 4ème année</title>
    <style>
        body {
            background-color: #090000;
            color: #ff0055;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 50px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        h1, p {
            color: #ffffff;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #aa0000;
            position: relative;
            z-index: 10;
        }
        h1 {
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 40px;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .menu-btn {
            display: inline-block;
            width: 80%;
            max-width: 400px;
            padding: 20px;
            background: rgba(20, 0, 5, 0.85);
            border: 1px solid #ff0055;
            color: #ff0055;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
            text-shadow: 0 0 5px #ff0000;
        }
        .menu-btn:hover {
            background-color: rgba(255, 0, 85, 0.3);
            box-shadow: 0 0 25px #ff0055;
            transform: scale(1.02);
            color: #ffffff;
        }
        .back-link {
            margin-top: 40px;
            position: relative;
            z-index: 10;
        }
        .back-link a {
            color: #ff69b4;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #ff0055;
            text-decoration: underline;
        }

        /* Écran de verrouillage par mot de passe */
        #password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 0, 5, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .login-box {
            background: rgba(25, 0, 10, 0.95);
            border: 1px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        .login-box h2 {
            color: #ffffff;
            text-shadow: 0 0 10px #ff0055;
            margin-top: 0;
        }
        .login-box input {
            padding: 10px;
            font-size: 1em;
            background: #000;
            border: 1px solid #ff0055;
            color: #ff0055;
            border-radius: 5px;
            margin-top: 15px;
            outline: none;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .login-box button {
            padding: 10px 20px;
            margin-top: 15px;
            background-color: #ff0055;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0055;
            display: block;
            width: 100%;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
        }
        .login-box button:hover {
            background-color: #ffffff;
            color: #090000;
            box-shadow: 0 0 15px #ff0055;
        }
        #error-msg { color: #ff4444; margin-top: 10px; font-size: 0.9em; display: none; }
    </style>
</head>
<body>

    <div id="password-overlay">
        <div class="login-box">
            <h2>Accès Protégé</h2>
            <input type="password" id="password-input" placeholder="Mot de passe">
            <button onclick="checkPassword()">Valider</button>
            <div id="error-msg">Mot de passe incorrect</div>
        </div>
    </div>

    <canvas id="matrix"></canvas>

    <div class="container" id="main-content" style="display: none;">
        <h1>Espace Collège - 4ème année</h1>
        <p>Choisissez votre option :</p>
        
        <div class="menu-grid">
            <a class="menu-btn" href="jeux-video/">Jeux vidéo</a>
            <a class="menu-btn" href="serious-game/">Serious game</a>
        </div>
        
        <div class="back-link">
            <a href="../index.html">⬅ Retour à l'accueil général</a>
        </div>
    </div>

    <script>
        function checkPassword() {
            if (document.getElementById('password-input').value === 'motdepasse4') {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const chars = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(9, 0, 5, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = fontSize + 'px monospace';
            drops.forEach((drop, i) => {
                ctx.fillStyle = ['#ff0055', '#ff3333', '#aa0022', '#ff6688'][Math.floor(Math.random()*4)];
                ctx.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * fontSize, drop * fontSize);
                if (drop * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
