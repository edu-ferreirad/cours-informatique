<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Protection des données</title>
    <style>
        body {
            background-color: #090500;
            color: #ff8800;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
            margin: 0;
            overflow-x: hidden;
        }
        /* Canvas pour la pluie Matrix orange */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        h1 {
            text-align: center;
            text-shadow: 0 0 10px #ff5500, 0 0 20px #ff3300;
            border-bottom: 2px dashed #ff5500;
            padding-bottom: 15px;
            letter-spacing: 2px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(20, 10, 0, 0.85);
            border: 1px solid #ff5500;
            box-shadow: 0 0 20px rgba(255, 85, 0, 0.3);
            padding: 30px;
            border-radius: 4px;
            position: relative;
            z-index: 1;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
            margin-top: 20px;
        }
        li {
            margin: 12px 0;
        }
        a {
            color: #ff7700;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #ff5500, 0 0 15px #ff5500;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 35px;
        }
        .btn-jdr {
            display: inline-block;
            width: 80%;
            text-align: center;
            background-color: #ff5500;
            color: #090500;
            border: 2px solid #ffaa00;
            padding: 14px 28px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            box-shadow: 0 0 15px #ff5500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-jdr:hover {
            background-color: #ffffff;
            color: #090500;
            border-color: #ffffff;
            box-shadow: 0 0 20px #ffffff, 0 0 30px #ff5500;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>// ACCÈS INDEX</h1>
        
        <ul>
            <li>📄 <a href="Brochure conseils avec sources-VF4neutre.pdf">Brochure de conseils (Neutre)</a></li>
            <li>📄 <a href="Présentation_à_faire pour_formation_en_ligne.pdf">Présentation formation en ligne</a></li>
        </ul>

        <div class="btn-container">
            <a href="Debut_enfant.html" class="btn-jdr">▶ Version Enfant</a>
            <a href="Debut_parent.html" class="btn-jdr">▶ Version Parent</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(9, 5, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff7700';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
