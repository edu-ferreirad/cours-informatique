<html>
<head>
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
<meta charset="utf-8"/>
<title>Protection des données</title>
<style>
body {
  background-image: url("jeu_parent/intro.jpg");
  background-repeat: no-repeat;
  background-size: 100% 100%;
  background-position: center;
}

.button{
  display: inline-block;
  border-radius: 4px;
  background-color: #1ac0a7;
  border: none;
  color: #FFFFFF;
  text-align: center;
  font-size: 28px;
  padding: 20px;
  width: 200px;
  transition: all 0.5s;
  cursor: pointer;
  margin: 450px;
}
.button span{
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: 0.5s;
}
.button span:after {
  content: '\00bb';
  position: absolute;
  opacity: 0;
  top: 0;
  right: -20px;
  transition: 0.5s;
}

.button:hover span {
  padding-right: 25px;
}

.button:hover span:after {
  opacity: 1;
  right: 0;
}

</style>
<script src="title-scroll.js" data-start="5000" data-speed="250"></script>

</head>

<body>
  
  <div style="text-align: center;"

  <h3></h3>
  <a href="jeu_parent/jeu.html" class="button" style="vertical-align:middle"><span>Jouer</span></a>

</body>
</html>
