<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Examens - 11ème</title>
    <style>
        body {
            background-color: #020408;
            color: #0088cc;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 0 0 8px #005588, 0 0 15px #002244;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 35px;
        }
        .btn-examen {
            display: inline-block;
            width: 80%;
            text-align: center;
            background-color: rgba(2, 6, 15, 0.9);
            color: #66ccff;
            border: 2px solid #005588;
            padding: 14px 28px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 85, 136, 0.3);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
            text-shadow: 0 0 5px #005588;
        }
        .btn-examen:hover {
            background-color: #003366;
            color: white;
            border-color: #ffffff;
            box-shadow: 0 0 20px #005588, 0 0 30px #0088cc;
        }
        .back-link {
            text-align: center;
            margin-top: 30px;
            position: relative;
            z-index: 10;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #003366;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 10px #003366;
            transition: background-color 0.3s;
        }
        .back-btn:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>Espace Examens - 11ème</h1>
        <div class="back-link">
            <a class="back-btn" href="index.html">⬅ Retour au menu 11ème</a>
        </div>

        <p>Sélectionnez l'examen de votre choix :</p>

        <div class="btn-container">
            <a href="examen_programmation.html" class="btn-examen">⌨️ Programmation</a>
            <a href="examen_cv.html" class="btn-examen">📄 CV</a>
            <a href="examen_lettre.html" class="btn-examen">✉️ Lettre de motivation</a>
            <a href="examen_presentation.html" class="btn-examen">📊 Présentation</a>
            <a href="examen_lego.html" class="btn-examen">🧱 LEGO</a>
            <a href="examen_images.html" class="btn-examen">🖼️ Traitement d'image</a>
            <a href="examen_recherches.html" class="btn-examen">🔍 Recherche internet</a>
            <a href="examen_tableur.html" class="btn-examen">📈 Tableur</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 4, 8, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const colors = ['#003366', '#005588', '#0088cc', '#001122'];
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
