<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Classeur - 11ème</title>
    <style>
        body {
            background-color: #020408;
            color: #0088cc;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            background: rgba(2, 6, 15, 0.9);
            border: 1px solid #005588;
            box-shadow: 0 0 20px rgba(0, 85, 136, 0.3);
            border-radius: 8px;
            padding: 30px;
        }
        h1, p {
            color: #ffffff;
            text-shadow: 0 0 8px #005588, 0 0 15px #002244;
            position: relative;
            z-index: 10;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #003366;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            box-shadow: 0 0 10px #003366;
            transition: background-color 0.3s;
            position: relative;
            z-index: 10;
        }
        .btn:hover {
            background-color: #002244;
        }
        a {
            color: #66ccff;
            text-decoration: none;
            position: relative;
            z-index: 10;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>Classeur - 11ème</h1>
        <p><a class="btn" href="index.html">⬅ Retour au menu 11ème</a></p>

        <p>Retrouvez ici les documents du classeur :</p>
        <p><a href="Classeur%2011ème.pdf" target="_blank">📄 Ouvrir le Classeur 11ème (PDF)</a></p>
        <!-- <p><a href="Copie%20de%20ProjetBrochureInformatique11e_2022.11.18.pdf" target="_blank">📄 Ouvrir Informatique 11e (PDF)</a></p> -->
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 4, 8, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const colors = ['#003366', '#005588', '#0088cc', '#001122'];
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
