<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Examens - 9ème</title>
    <style>
        body {
            background-color: #050914;
            color: #00ffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #0044ff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 35px;
        }
        .btn-examen {
            display: inline-block;
            width: 80%;
            text-align: center;
            background-color: rgba(5, 15, 35, 0.85);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 14px 28px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
            text-shadow: 0 0 5px #00bfff;
        }
        .btn-examen:hover {
            background-color: #00ffff;
            color: #050914;
            border-color: #ffffff;
            box-shadow: 0 0 20px #00ffff, 0 0 30px #00bfff;
        }
        .back-link {
            text-align: center;
            margin-top: 30px;
            position: relative;
            z-index: 10;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <h1>Espace Examens - 9ème</h1>
        <div class="back-link">
            <a class="back-btn" href="index.html">⬅ Retour au menu 9ème</a>
        </div>

        <p>Sélectionnez l'examen de votre choix :</p>

        <div class="btn-container">
            <a href="examen_recherche_internet.html" class="btn-examen">🔍 Recherche Internet</a>
            <a href="examen_dessin_ordinateur.html" class="btn-examen">🎨 Dessin Ordinateur</a>
            <a href="examen_lapin.html" class="btn-examen">🐰 Lapin</a>
            <a href="examen_quizz_hygiene.html" class="btn-examen">🛡️ Quizz Hygiène Internet</a>
            <a href="examen_dactylographie.html" class="btn-examen">⌨️ Dactylographie</a>
            <a href="examen_texte.html" class="btn-examen">⌨️ Traitement de texte</a>
            <a href="examen_tableur.html" class="btn-examen">⌨️ Tableur</a>
            <a href="examen_presentation.html" class="btn-examen">⌨️ Présentation</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 9, 20, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
