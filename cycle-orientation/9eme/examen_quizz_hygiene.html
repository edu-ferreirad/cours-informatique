<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Examen - Prévention de base</title>
    <style>
        body {
            background-color: #050914;
            color: #00ffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            background: rgba(5, 15, 35, 0.85);
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 30px;
        }
        h1, p, label, h2 {
            color: #ffffff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #0044ff;
        }
        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 4px;
            text-align: center;
            font-size: 1em;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            box-shadow: 0 0 10px #007bff;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .hidden {
            display: none !important;
        }
        .question-box {
            text-align: left;
            margin-top: 20px;
        }
        .options-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: rgba(0, 20, 50, 0.9);
            border: 1px solid #00ffff;
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            font-size: 1em;
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background: rgba(0, 100, 200, 0.5);
            border-color: #fff;
            box-shadow: 0 0 10px #00ffff;
        }
        .score-box {
            margin-top: 20px;
            font-size: 1.2em;
        }
        
        /* Style d'impression (PDF) */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0;
            }
            canvas, .btn, #matrix, #step-result > h2, #step-result > p, .score-box, a {
                display: none !important;
            }
            .container {
                background: white !important;
                border: none !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0;
                margin: 0;
            }
            .print-report {
                display: block !important;
                text-align: left;
                font-size: 0.95em;
                margin-top: 0;
                color: black !important;
            }
            .print-report h3, .print-report p, .print-report strong, .print-report span, .print-report em {
                color: black !important;
                text-shadow: none !important;
            }
            .print-item {
                margin-bottom: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid #ccc;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container" id="app-container">
        <h1>Examen - Prévention de base</h1>

        <!-- ÉTAPE 1 : Identification et Mot de passe -->
        <div id="step-login">
            <p>Veuillez entrer vos informations pour commencer :</p>
            <input type="password" id="exam-password" placeholder="Mot de passe professeur"><br>
            <input type="text" id="student-nom" placeholder="Nom"><br>
            <input type="text" id="student-prenom" placeholder="Prénom"><br>
            <input type="text" id="student-classe" placeholder="Classe"><br><br>
            <button class="btn" onclick="startExam()">Commencer l'examen</button>
            <p id="login-error" style="color: #ff4444;"></p>
        </div>

        <!-- ÉTAPE 2 : Questionnaire (Une question à la fois, choix A ou B) -->
        <div id="step-quiz" class="hidden">
            <p id="progress-indicator" style="font-size: 0.9em; color: #00bfff;"></p>
            <div class="question-box">
                <p id="question-text" style="font-weight: bold; font-size: 1.1em;"></p>
                <div class="options-container" id="options-wrapper">
                    <!-- Les boutons A et B seront injectés dynamiquement de manière aléatoire -->
                </div>
            </div>
        </div>

        <!-- ÉTAPE 3 : Résultat -->
        <div id="step-result" class="hidden">
            <h2>Examen terminé !</h2>
            <p>Merci <strong><span id="res-prenom"></span> <span id="res-nom"></span></strong> (<span id="res-classe"></span>).</p>
            <div class="score-box">
                <span>Note : </span>
                <span id="hidden-score" class="hidden" style="color: #00ff00; font-weight: bold; font-size: 1.3em;"></span>
                <button class="btn" id="eye-btn" onclick="toggleScore()">👁️ Afficher la note</button>
            </div>
            <p style="font-size: 0.85em; color: #ffeb3b; margin-top: 10px; text-shadow: 0 0 5px rgba(255, 235, 59, 0.5);">* C'est une note indicative avant validation par l'enseignant</p>
            <br><br>
            <button class="btn" onclick="window.print()" style="background-color: #28a745;">🖨️ Imprimer / Sauvegarder en PDF</button>
            <br><br>
            <a class="btn" href="examens.html" style="background-color: #6c757d;">⬅ Retour aux examens</a>

            <!-- Rapport détaillé pour l'affichage et l'impression -->
            <div id="print-report" class="print-report" style="margin-top: 30px; text-align: left;"></div>
        </div>
    </div>

    <script>
        const allQuestions = [
            { 
                q: "Vous recevez un e-mail pour créer une chaîne de solidarité qui aidera une petite fille à guérir d'une leucémie...", 
                options: [
                    { text: "Vous le faites suivre à vos contacts.", isCorrect: false },
                    { text: "Vous vérifiez sur Internet si c'est fiable.", isCorrect: true }
                ]
            },
            { 
                q: "Un blog...", 
                options: [
                    { text: "Ce n'est ni plus ni moins qu'un site facile à éditer et à consulter.", isCorrect: true },
                    { text: "C'est un site où l'on peut tout dire de soi et raconter n'importe quoi.", isCorrect: false }
                ]
            },
            { 
                q: "La meilleure façon de se débarrasser des spams...", 
                options: [
                    { text: "C'est de ne pas les ouvrir et de les supprimer immédiatement.", isCorrect: true },
                    { text: "C'est de répondre à leur expéditeur en lui demandant de ne plus vous importer.", isCorrect: false }
                ]
            },
            { 
                q: "Si vous tombez sur un site dont le contenu vous choque...", 
                options: [
                    { text: "Il peut être signalé à des services compétents qui verront si ce site est hors-la-loi ou pas.", isCorrect: true },
                    { text: "Il n'y a rien d'autre à faire que de le refermer et de l'oublier.", isCorrect: false }
                ]
            }
        ];

        let selectedQuestions = [];
        let currentIndex = 0;
        let scoreNote = 6.0;
        let studentData = {};
        let examResults = [];
        let currentShuffledOptions = [];

        function startExam() {
            const pwd = document.getElementById('exam-password').value;
            const nom = document.getElementById('student-nom').value.trim();
            const prenom = document.getElementById('student-prenom').value.trim();
            const classe = document.getElementById('student-classe').value.trim();

            if (pwd !== "prof123") {
                document.getElementById('login-error').innerText = "Mot de passe incorrect.";
                return;
            }
            if (!nom || !prenom || !classe) {
                document.getElementById('login-error').innerText = "Veuillez remplir tous les champs.";
                return;
            }

            studentData = { nom, prenom, classe };

            // 1. Mélanger l'ordre des 4 questions pour chaque élève
            selectedQuestions = [...allQuestions].sort(() => 0.5 - Math.random());

            document.getElementById('step-login').classList.add('hidden');
            document.getElementById('step-quiz').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            const currentQ = selectedQuestions[currentIndex];
            document.getElementById('progress-indicator').innerText = `Question ${currentIndex + 1} / ${selectedQuestions.length}`;
            document.getElementById('question-text').innerText = currentQ.q;

            // 2. Mélanger l'ordre des options (A et B inversées aléatoirement)
            currentShuffledOptions = [...currentQ.options].sort(() => 0.5 - Math.random());

            const optionsWrapper = document.getElementById('options-wrapper');
            optionsWrapper.innerHTML = '';

            const letters = ['A', 'B'];
            currentShuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = letters[idx] + ". " + opt.text;
                // On passe l'index de l'option mélangée au clic
                btn.onclick = () => selectAnswer(idx);
                optionsWrapper.appendChild(btn);
            });
        }

        function selectAnswer(optionIndex) {
            const chosenOption = currentShuffledOptions[optionIndex];
            const isCorrect = chosenOption.isCorrect;

            // Retrouver le texte de la bonne réponse pour le rapport
            const correctOptObj = currentShuffledOptions.find(o => o.isCorrect);
            const userOptLetter = ['A', 'B'][optionIndex];
            const correctOptLetter = ['A', 'B'][currentShuffledOptions.indexOf(correctOptObj)];

            examResults.push({
                question: selectedQuestions[currentIndex].q,
                userAnswer: userOptLetter + ". " + chosenOption.text,
                correctAnswer: correctOptLetter + ". " + correctOptObj.text,
                isCorrect: isCorrect
            });

            if (!isCorrect) {
                scoreNote -= 1.0; // Enlève 1 point par erreur
                if (scoreNote < 1.0) scoreNote = 1.0;
            }

            currentIndex++;

            if (currentIndex < selectedQuestions.length) {
                loadQuestion();
            } else {
                finishExam();
            }
        }

        function finishExam() {
            document.getElementById('step-quiz').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');

            document.getElementById('res-nom').innerText = studentData.nom;
            document.getElementById('res-prenom').innerText = studentData.prenom;
            document.getElementById('res-classe').innerText = studentData.classe;
            document.getElementById('hidden-score').innerText = scoreNote.toFixed(1);

            let reportHTML = `<h3>Rapport d'Examen - ${studentData.prenom} ${studentData.nom} (${studentData.classe})</h3>`;
            reportHTML += `<p><strong>Note finale (indicative) : ${scoreNote.toFixed(1)} / 6</strong></p>`;
            reportHTML += `<p style="font-size: 0.9em; font-style: italic;">* C'est une note indicative avant validation par l'enseignant</p><hr>`;
            
            examResults.forEach((item, index) => {
                reportHTML += `
                    <div class="print-item">
                        <p><strong>Q${index + 1}: ${item.question}</strong></p>
                        <p>Réponse élève : <span style="color: ${item.isCorrect ? '#28a745' : '#dc3545'}; font-weight: bold;">${item.userAnswer}</span></p>
                        <p>Réponse attendue : <em>${item.correctAnswer}</em></p>
                    </div>
                `;
            });

            document.getElementById('print-report').innerHTML = reportHTML;
        }

        function toggleScore() {
            const scoreSpan = document.getElementById('hidden-score');
            const btn = document.getElementById('eye-btn');
            if (scoreSpan.classList.contains('hidden')) {
                scoreSpan.classList.remove('hidden');
                btn.innerText = "🙈 Masquer la note";
            } else {
                scoreSpan.classList.add('hidden');
                btn.innerText = "👁️ Afficher la note";
            }
        }

        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 9, 20, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
