<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeux - 9ème</title>
    <style>
        body {
            background-color: #050914;
            color: #00ffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #0044ff;
        }
        .game-link {
            display: block;
            margin: 15px auto;
            color: #00ffff;
            text-decoration: underline;
            font-size: 16px;
            position: relative;
            z-index: 10;
            text-shadow: 0 0 5px #00bfff;
        }
        .game-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <h1>Espace Jeux - 9ème</h1>
    <p><a class="back-btn" href="index.html">⬅ Retour au menu 9ème</a></p>

    <p>Cliquez sur l'activité de votre choix :</p>

    <!-- Remplacez les liens par les adresses de vos choix -->
    <a class="game-link" href="https://learningapps.org/watch?v=pde90hqct25" target="_blank">Mes jeux</a>
    <a class="game-link" href="https://www.educlasse.ch/cycle-3/9e" target="_blank">Educlasse</a>
    <a class="game-link" href="https://opendata.geneve.ch/www/medias/chasse_aux_oeufs_virtuelle/" target="_blank">Chasse aux oeufs</a>
    <a class="game-link" href="https://www.dactylocours.com/test.php" target="_blank">Dactylo</a>
    <a class="game-link" href="https://studio.code.org/fr/courses/courseb-2025/units/1/lessons/4/levels/2?lang=fr-FR" target="_blank">Studio.org</a>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 9, 20, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
