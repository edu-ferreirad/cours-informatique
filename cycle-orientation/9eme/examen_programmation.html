<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Examen - Binaire</title>
    <style>
        body {
            background-color: #050914;
            color: #00ffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            background: rgba(5, 15, 35, 0.85);
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 30px;
        }
        h1, p, label, h2 {
            color: #ffffff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #0044ff;
        }
        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #00ffff;
            color: #00ffff;
            border-radius: 4px;
            text-align: center;
            font-size: 1em;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 15px;
            box-shadow: 0 0 10px #007bff;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .hidden {
            display: none !important;
        }
        .question-box {
            text-align: left;
            margin-top: 20px;
        }
        .score-box {
            margin-top: 20px;
            font-size: 1.2em;
        }
        
        /* Style d'impression (PDF) */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0;
            }
            canvas, .btn, #matrix, #step-result > h2, #step-result > p, .score-box, a {
                display: none !important;
            }
            .container {
                background: white !important;
                border: none !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0;
                margin: 0;
            }
            .print-report {
                display: block !important;
                text-align: left;
                font-size: 0.95em;
                margin-top: 0;
                color: black !important;
            }
            .print-report h3, .print-report p, .print-report strong, .print-report span, .print-report em {
                color: black !important;
                text-shadow: none !important;
            }
            .print-item {
                margin-bottom: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid #ccc;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="container" id="app-container">
        <h1>Examen - Binaire</h1>

        <!-- ÉTAPE 1 : Identification et Mot de passe -->
        <div id="step-login">
            <p>Veuillez entrer vos informations pour commencer :</p>
            <input type="password" id="exam-password" placeholder="Mot de passe professeur"><br>
            <input type="text" id="student-nom" placeholder="Nom"><br>
            <input type="text" id="student-prenom" placeholder="Prénom"><br>
            <input type="text" id="student-classe" placeholder="Classe"><br><br>
            <button class="btn" onclick="startExam()">Commencer l'examen</button>
            <p id="login-error" style="color: #ff4444;"></p>
        </div>

        <!-- ÉTAPE 2 : Questionnaire (Une question à la fois, aléatoire) -->
        <div id="step-quiz" class="hidden">
            <p id="progress-indicator" style="font-size: 0.9em; color: #00bfff;"></p>
            <div class="question-box">
                <p id="question-text" style="font-weight: bold; font-size: 1.1em;"></p>
                <input type="text" id="student-answer" placeholder="Votre réponse..." style="width: 100%;">
            </div>
            <button class="btn" onclick="nextQuestion()">Valider et continuer</button>
        </div>

        <!-- ÉTAPE 3 : Résultat -->
        <div id="step-result" class="hidden">
            <h2>Examen terminé !</h2>
            <p>Merci <strong><span id="res-prenom"></span> <span id="res-nom"></span></strong> (<span id="res-classe"></span>).</p>
            <div class="score-box">
                <span>Note : </span>
                <span id="hidden-score" class="hidden" style="color: #00ff00; font-weight: bold; font-size: 1.3em;"></span>
                <button class="btn" id="eye-btn" onclick="toggleScore()">👁️ Afficher la note</button>
            </div>
            <p style="font-size: 0.85em; color: #ffeb3b; margin-top: 10px; text-shadow: 0 0 5px rgba(255, 235, 59, 0.5);">* C'est une note indicative avant validation par l'enseignant</p>
            <br><br>
            <button class="btn" onclick="window.print()" style="background-color: #28a745;">🖨️ Imprimer / Sauvegarder en PDF</button>
            <br><br>
            <a class="btn" href="examens.html" style="background-color: #6c757d;">⬅ Retour aux examens</a>

            <!-- Rapport détaillé pour l'affichage et l'impression -->
            <div id="print-report" class="print-report" style="margin-top: 30px; text-align: left;"></div>
        </div>
    </div>

    <script>
        const allQuestions = [
            { q: "Quelle(s) carte(s) devez-vous retourner pour faire exactement 6 ? (ex: quel carte pour 3, donnez la réponse sous forme de 2 et 1)", a: "4 et 2" },
            { q: "Quelle(s) carte(s) devez-vous retourner pour faire exactement 4 ? (ex: quel carte pour 3, donnez la réponse sous forme de 2 et 1)", a: "4" },
            { q: "Quelle(s) carte(s) devez-vous retourner pour faire exactement 20 ? (ex: quel carte pour 3, donnez la réponse sous forme de 2 et 1)", a: "16 et 4" },
            { q: "Quel est le plus petit nombre qui peut être trouvé grâce aux cartes?", a: "0" },
            { q: "Convertissez en base décimale le nombre 11101", a: "29" },
            { q: "Convertissez en base décimale le nombre 1101", a: "13" },
            { q: "Combien de points doit contenir la septième carte pour que le système fonctionne ?", a: "64" },
            { q: "Quelle dimension physique impose le langage binaire aux ordinateurs ?", a: "l'électricité" }
        ];

        let selectedQuestions = [];
        let currentIndex = 0;
        let scoreNote = 6.0;
        let studentData = {};
        let examResults = [];

        function startExam() {
            const pwd = document.getElementById('exam-password').value;
            const nom = document.getElementById('student-nom').value.trim();
            const prenom = document.getElementById('student-prenom').value.trim();
            const classe = document.getElementById('student-classe').value.trim();

            if (pwd !== "prof123") {
                document.getElementById('login-error').innerText = "Mot de passe incorrect.";
                return;
            }
            if (!nom || !prenom || !classe) {
                document.getElementById('login-error').innerText = "Veuillez remplir tous les champs.";
                return;
            }

            studentData = { nom, prenom, classe };

            // Mélange toutes les questions pour éviter les copies entre voisins
            selectedQuestions = [...allQuestions].sort(() => 0.5 - Math.random());

            document.getElementById('step-login').classList.add('hidden');
            document.getElementById('step-quiz').classList.remove('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('progress-indicator').innerText = `Question ${currentIndex + 1} / ${selectedQuestions.length}`;
            document.getElementById('question-text').innerText = selectedQuestions[currentIndex].q;
            document.getElementById('student-answer').value = "";
        }

        function nextQuestion() {
            const rawUserAnswer = document.getElementById('student-answer').value;
            const userAnswer = rawUserAnswer.trim().toLowerCase();
            const correctAnswer = selectedQuestions[currentIndex].a.trim().toLowerCase();

            const isCorrect = (userAnswer === correctAnswer);

            examResults.push({
                question: selectedQuestions[currentIndex].q,
                userAnswer: rawUserAnswer.trim() || "(Aucune réponse)",
                correctAnswer: selectedQuestions[currentIndex].a.trim(),
                isCorrect: isCorrect
            });

            if (!isCorrect) {
                scoreNote -= 0.5;
                if (scoreNote < 1.0) scoreNote = 1.0;
            }

            currentIndex++;

            if (currentIndex < selectedQuestions.length) {
                loadQuestion();
            } else {
                finishExam();
            }
        }

        function finishExam() {
            document.getElementById('step-quiz').classList.add('hidden');
            document.getElementById('step-result').classList.remove('hidden');

            document.getElementById('res-nom').innerText = studentData.nom;
            document.getElementById('res-prenom').innerText = studentData.prenom;
            document.getElementById('res-classe').innerText = studentData.classe;
            document.getElementById('hidden-score').innerText = scoreNote.toFixed(1);

            let reportHTML = `<h3>Rapport d'Examen - ${studentData.prenom} ${studentData.nom} (${studentData.classe})</h3>`;
            reportHTML += `<p><strong>Note finale (indicative) : ${scoreNote.toFixed(1)} / 6</strong></p>`;
            reportHTML += `<p style="font-size: 0.9em; font-style: italic;">* C'est une note indicative avant validation par l'enseignant</p><hr>`;
            
            examResults.forEach((item, index) => {
                reportHTML += `
                    <div class="print-item">
                        <p><strong>Q${index + 1}: ${item.question}</strong></p>
                        <p>Réponse élève : <span style="color: ${item.isCorrect ? '#28a745' : '#dc3545'}; font-weight: bold;">${item.userAnswer}</span></p>
                        <p>Réponse attendue : <em>${item.correctAnswer}</em></p>
                    </div>
                `;
            });

            document.getElementById('print-report').innerHTML = reportHTML;
        }

        function toggleScore() {
            const scoreSpan = document.getElementById('hidden-score');
            const btn = document.getElementById('eye-btn');
            if (scoreSpan.classList.contains('hidden')) {
                scoreSpan.classList.remove('hidden');
                btn.innerText = "🙈 Masquer la note";
            } else {
                scoreSpan.classList.add('hidden');
                btn.innerText = "👁️ Afficher la note";
            }
        }

        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 9, 20, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffff';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
