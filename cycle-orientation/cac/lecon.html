<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours</title>
<link rel="stylesheet" href="style.css">
<style>figure{margin:18px 0;padding:10px;border:1px solid #003366;border-radius:6px;background:#00060f}img{max-width:100%;height:auto;border-radius:4px;display:block;margin:0 auto}.tr{white-space:pre-line;line-height:1.5;margin-top:10px;max-width:70ch}.tr b{color:#fff}</style>
</head>
<body data-page="lecon">
<canvas id="matrix"></canvas>
<div class="box" id="app" hidden>
  <div class="top" translate="no"><a href="cours.html" data-i="backc">⬅ Retour aux cours</a>
    <label><span data-i="lang">Langue</span> :
      <select id="langSel" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option></select></label></div>
  <h1 id="lt"></h1>
  <div id="lc"></div>
</div>
<script src="common.js"></script>
<script src="translate.js"></script>
<script>
const id=(new URLSearchParams(location.search).get("id")||"").replace(/[^a-z0-9-]/g,"");
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
window.onLang=function(l){
  if(typeof LECON==="undefined")return;
  const D=LECON,T=D.t[l]||D.t.fr;document.title=T;
  const h=$("lt");h.textContent=T;h.setAttribute("translate",D.auto?"yes":"no");
  $("lc").innerHTML=(D.auto&&l!=="fr"?'<p class="note" translate="no">'+L[l].auto+"</p>":"")+D.img.map((f,i)=>{
    const tx=l==="fr"?"":(D.auto?D.fr[i]:D.tr[l][i])||"";
    const [hd,...r]=esc(tx).split("\n");
    return '<figure><img loading="lazy" src="lecons/'+id+'/'+f+'" alt="'+(i+1)+'">'+(tx?'<div class="tr"'+(D.auto?"":' translate="no"')+"><b>"+hd+"</b>\n"+r.join("\n")+"</div>":"")+"</figure>";
  }).join("");
  if(D.auto&&window.gtLoad)gtLoad(l);
};
if(id){const e=document.createElement("script");e.src="lecon/"+id+".js";e.onload=()=>window.onLang(lang);document.body.appendChild(e)}
</script>
</body>
</html>
