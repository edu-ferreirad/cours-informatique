<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>La parole est une voie</title>
    <style>
        body {
            background-color: #050914;
            color: #00ffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #0044ff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        .cours-card {
            background: rgba(5, 15, 35, 0.85);
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            margin: 25px auto;
            padding: 20px;
            width: 90%;
        }
        .cours-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00bfff;
        }
        .pdf-container {
            width: 100%;
            height: 450px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #0044ff;
            background: #ffffff;
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Bouton de téléchargement */
        .download-btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #00ffcc;
            color: #050914;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 15px #00ffcc;
            transition: 0.3s;
        }
        .download-btn:hover { background-color: #ffffff; box-shadow: 0 0 20px #ffffff; }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 0 0 10px #007bff;
        }
        #password-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 9, 20, 0.95); z-index: 1000;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .login-box {
            background: rgba(5, 15, 35, 0.95); border: 1px solid #00ffff;
            padding: 30px; border-radius: 10px; text-align: center;
        }
        .login-box input { padding: 10px; background: #000; border: 1px solid #0044ff; color: #00ffff; border-radius: 5px; margin-top: 15px; }
        .login-box button { padding: 10px 20px; margin-top: 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="password-overlay">

        </div>

        <div class="cours-card">

            <a href="04 - Plan de durée.xlsx" class="download-btn" download>📥 Télécharger le fichier</a>
        </div>

        <div class="cours-card">
            <div class="cours-title">📝 03 - Notes de cours.docx</div>
            <a href="03 - Notes de cours.docx" class="download-btn" download>📥 Télécharger le fichier</a>
        </div>
    </div>

    <script>
        function checkPassword() {
            if (document.getElementById('password-input').value === 'lpeuv26') {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

</body>
</html>
