<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>20 ans de Drize</title>
    <style>
        body {
            background-color: #050914;
            color: #00ffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #0044ff;
        }
        h2 {
            position: relative;
            z-index: 10;
            color: #00ffff;
            text-shadow: 0 0 10px #00bfff;
            margin-top: 40px;
            font-size: 1.5em;
            border-bottom: 1px solid #00ffff;
            display: inline-block;
            padding-bottom: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        .cours-card {
            background: rgba(5, 15, 35, 0.85);
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            margin: 25px auto;
            padding: 20px;
            width: 90%;
        }
        .cours-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00bfff;
        }
        .pdf-container {
            width: 100%;
            height: 450px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #0044ff;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 10px #007bff;
        }
        .back-btn:hover {
            background-color: #0056b3;
            box-shadow: 0 0 15px #00ffff;
        }
        /* Password Overlay */
        #password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 9, 20, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .login-box {
            background: rgba(5, 15, 35, 0.95);
            border: 1px solid #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        .login-box input {
            padding: 10px;
            font-size: 1em;
            background: #000;
            border: 1px solid #0044ff;
            color: #00ffff;
            border-radius: 5px;
            margin-top: 15px;
            outline: none;
            text-align: center;
        }
        .login-box button {
            padding: 10px 20px;
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px #007bff;
            display: block;
            width: 100%;
        }
        .login-box button:hover {
            background-color: #0056b3;
            box-shadow: 0 0 15px #00ffff;
        }
        #error-msg {
            color: #ff4444;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Password Prompt Overlay -->
    <div id="password-overlay">
        <div class="login-box">
            <h2>Accès Protégé</h2>
            <p>Veuillez entrer le mot de passe :</p>
            <input type="password" id="password-input" placeholder="Mot de passe">
            <button onclick="checkPassword()">Valider</button>
            <div id="error-msg">Mot de passe incorrect</div>
        </div>
    </div>

    <canvas id="matrix"></canvas>

    <div class="container" id="main-content" style="display: none;">
        <h1>20 ans de Drize</h1>
        <p><a class="back-btn" href="../index.html">⬅ Retour aux projets</a></p>

        <h2>Documents et Prévisualisations</h2>

        <!-- 1. Affiche.pdf -->
        <div class="cours-card">
            <div class="cours-title">📄 Affiche.pdf</div>
            <div class="pdf-container">
                <iframe src="Affiche.pdf"></iframe>
            </div>
        </div>

        <!-- 2. Flyer 16 gestes.pdf -->
        <div class="cours-card">
            <div class="cours-title">📄 Flyer 16 gestes.pdf</div>
            <div class="pdf-container">
                <iframe src="Flyer 16 gestes.pdf"></iframe>
            </div>
        </div>

        <!-- 3. Journal 1111 v2.pdf -->
        <div class="cours-card">
            <div class="cours-title">📄 Journal 1111 v2.pdf</div>
            <div class="pdf-container">
                <iframe src="Journal 1111 v2.pdf"></iframe>
            </div>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pwd = document.getElementById('password-input').value;
            if (pwd === '20adcod') {
                document.getElementById('password-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 9, 20, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                const randShade = Math.random();
                if (randShade < 0.33) {
                    ctx.fillStyle = '#00ffff';
                } else if (randShade < 0.66) {
                    ctx.fillStyle = '#00bfff';
                } else {
                    ctx.fillStyle = '#0044ff';
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
