async function deriveKey(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.salt),iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
}
const decrypt=(key,o)=>crypto.subtle.decrypt({name:"AES-GCM",iv:b64(o.iv)},key,b64(o.d));
async function tryPw(){
  const err=document.getElementById("err");
  if(!(window.crypto&&crypto.subtle)){err.textContent="Ouvrez cette page en https (GitHub Pages).";return;}
  err.textContent="Vérification…";
  try{
    const key=await deriveKey(document.getElementById("pw").value);
    const html=new TextDecoder().decode(await decrypt(key,BLOB.html));
    const box=document.getElementById("fiche");
    box.innerHTML=html;
    if(BLOB.docx){
      const b=document.createElement("button");b.type="button";b.className="pbtn noprint";b.textContent="⬇️ Télécharger la fiche (Word)";
      b.addEventListener("click",async()=>{
        const buf=await decrypt(key,BLOB.docx);
        const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}));
        const a=document.createElement("a");a.href=url;a.download=BLOB.docxName;document.body.appendChild(a);a.click();a.remove();
      });
      box.insertBefore(b,box.querySelector("h2"));
    }
    document.getElementById("gate").classList.add("hidden");box.classList.remove("hidden");err.textContent="";
  }catch(e){err.textContent="✘ Mot de passe incorrect.";document.getElementById("pw").value="";}
}
document.getElementById("go").addEventListener("click",tryPw);
document.getElementById("pw").addEventListener("keydown",(e)=>{if(e.key==="Enter")tryPw();});
</script></body></html>
