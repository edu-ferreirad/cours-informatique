<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Projets - David Ferreira</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #050914;
    font-family: Arial, sans-serif;
    color: #ffffff;
}

/* Conteneur principal des projets (affiché directement) */
#main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    padding: 20px;
}

h1.portal-title {
    color: #1ac0a7;
    font-size: clamp(22px, 4vw, 36px);
    text-align: center;
    margin-bottom: 30px;
    text-shadow: 0 0 15px rgba(26, 192, 167, 0.4);
}

/* Boutons Matrix Bleu */
.button {
    display: inline-block;
    border-radius: 4px;
    background: linear-gradient(135deg, #0d4d42 0%, #1ac0a7 100%);
    border: 1px solid #1ac0a7;
    color: #FFFFFF;
    text-align: center;
    font-size: clamp(16px, 3vw, 22px);
    padding: clamp(14px, 2.5vw, 18px) clamp(20px, 4vw, 30px);
    width: min(90vw, 450px);
    transition: all 0.3s ease;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(128, 255, 229, 0.2);
    text-decoration: none;
    font-weight: bold;
}

.button:hover {
    background: linear-gradient(135deg, #126b5d 0%, #33d1b9 100%);
    box-shadow: 0 6px 20px rgba(26, 192, 167, 0.6), inset 0 0 15px rgba(128, 255, 229, 0.4);
    transform: translateY(-2px);
    color: #e0fffb;
}

/* Lien discret bas de page */
.credits-link {
    position: fixed;
    bottom: 15px;
    right: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.8em;
    text-decoration: none;
    transition: color 0.3s;
}

.credits-link:hover {
    color: #1ac0a7;
    text-decoration: underline;
}
</style>
<script src="title-scroll.js" data-start="5000" data-speed="250"></script>
</head>

<body>

    <!-- Contenu principal du Hub -->
    <div id="main-content">
        <h1 class="portal-title">Portail des Projets</h1>

        <!-- Boutons de navigation vers les projets -->
        <a href="escape_game/index.html" class="button">Escape Game</a>
        <a href="jeunes_reporters/index.html" class="button">Jeunes reporters pour l'environnement</a>
        <a href="la_parole_est_une_voix/index.html" class="button">La parole est une voie</a>
        <a href="hack_party/index.html" class="button">Hack Party</a>
        <a href="reflex/index.html" class="button">Reflex</a>
    </div>

    <!-- Crédits discrets -->
    <a href="javascript:void(0);" class="credits-link">David Ferreira (CO Driez / SEM Lab)</a>

</body>
</html>
