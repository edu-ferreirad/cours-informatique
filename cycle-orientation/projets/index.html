<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeunes Reporters pour l'Environnement</title>
    <style>
        body {
            background-color: #050914;
            color: #00ffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        h1, p {
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 0 0 10px #00bfff, 0 0 20px #0044ff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            padding-bottom: 50px;
        }
        .cours-card {
            background: rgba(5, 15, 35, 0.85);
            border: 1px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            margin: 25px auto;
            padding: 20px;
            width: 90%;
        }
        .cours-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #00bfff;
        }
        .pdf-container {
            width: 100%;
            height: 450px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #0044ff;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .doc-link {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 0 10px #007bff;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .doc-link:hover {
            background-color: #0056b3;
            box-shadow: 0 0 15px #00ffff;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 10px #007bff;
        }
        .back-btn:hover {
            background-color: #0056b3;
            box-shadow: 0 0 15px #00ffff;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container" id="main-content">
        <h1>Jeunes Reporters pour l'Environnement</h1>
        <p><a class="back-btn" href="../index.html">⬅ Retour au portail</a></p>

        <p>Documents et ressources :</p>

        <!-- 1. Slam - L’IA rend paresseux-CO Drize.pdf (Prévisualisation PDF) -->
        <div class="cours-card">
            <div class="cours-title">📄 Slam - L’IA rend paresseux-CO Drize.pdf</div>
            <div class="pdf-container">
                <iframe src="Slam - L’IA rend paresseux-CO Drize.pdf"></iframe>
            </div>
        </div>

        <!-- 2. Fichier texte (.txt) en téléchargement -->
        <div class="cours-card">
            <div class="cours-title">📝 sujets_debats.txt</div>
            <p><a class="doc-link" href="sujets_debats.txt" download>Télécharger le fichier texte</a></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 9, 20, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                const randShade = Math.random();
                if (randShade < 0.33) {
                    ctx.fillStyle = '#00ffff';
                } else if (randShade < 0.66) {
                    ctx.fillStyle = '#00bfff';
                } else {
                    ctx.fillStyle = '#0044ff';
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
