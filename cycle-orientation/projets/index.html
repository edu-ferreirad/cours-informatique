<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail des Projets</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #050914;
    font-family: Arial, sans-serif;
    color: #ffffff;
    overflow-x: hidden;
}

/* Toile de fond Matrix */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Conteneur principal des projets */
#main-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    padding: 20px;
}

h1.portal-title {
    color: #00ffff;
    font-size: clamp(22px, 4vw, 36px);
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
}

/* Boutons Matrix Bleu (clair, bleu, bleu foncé) */
.button {
    display: inline-block;
    border-radius: 6px;
    background: linear-gradient(135deg, #0044ff 0%, #00bfff 50%, #00ffff 100%);
    border: 1px solid #00ffff;
    color: #000000;
    text-align: center;
    font-size: clamp(16px, 3vw, 20px);
    padding: clamp(14px, 2.5vw, 18px) clamp(20px, 4vw, 30px);
    width: min(90vw, 450px);
    transition: all 0.3s ease;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 68, 255, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.4);
    text-decoration: none;
    font-weight: bold;
}

.button:hover {
    background: linear-gradient(135deg, #0056b3 0%, #00ffff 100%);
    box-shadow: 0 6px 20px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.6);
    transform: translateY(-2px);
    color: #050914;
}

/* Crédits discrets bas de page */
.credits-link {
    position: fixed;
    bottom: 15px;
    right: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.8em;
    text-decoration: none;
    z-index: 10;
    transition: color 0.3s;
}

.credits-link:hover {
    color: #00ffff;
    text-decoration: underline;
}
</style>
</head>

<body>

    <!-- Effet Matrix en arrière-plan -->
    <canvas id="matrix"></canvas>

    <!-- Contenu principal du Hub -->
    <div id="main-content">
        <h1 class="portal-title">Portail des Projets</h1>

        <!-- Boutons pointant vers les dossiers exacts -->
        <a href="escape_game/index.html" class="button">📁 Escape Game</a>
        <a href="hack_party/index.html" class="button">📁 Hack Party</a>
        <a href="jeunes_reporters/index.html" class="button">📁 Jeunes Reporters Pour L'environnement</a>
        <a href="la_parole_est_une_voix/index.html" class="button">📁 La parole est une voie</a>
        <a href="reflex/index.html" class="button">📁 Reflex</a>
    </div>

    <!-- Crédits discrets -->
    <a href="javascript:void(0);" class="credits-link">David Ferreira (CO Drize)</a>

    <script>
        // Animation Matrix
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ<>/\\{}[]*&é"\'(-)=+';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 9, 20, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                const randShade = Math.random();
                if (randShade < 0.33) {
                    ctx.fillStyle = '#00ffff'; // Bleu clair
                } else if (randShade < 0.66) {
                    ctx.fillStyle = '#00bfff'; // Bleu
                } else {
                    ctx.fillStyle = '#0044ff'; // Bleu foncé
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
