<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Projets - David Ferreira</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #050914;
    font-family: Arial, sans-serif;
    color: #ffffff;
}

/* Écran de verrouillage / Mot de passe */
#auth-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(5, 9, 20, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(8px);
}

.auth-box {
    background: rgba(10, 25, 50, 0.9);
    border: 2px solid #1ac0a7;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(26, 192, 167, 0.4);
    text-align: center;
    width: min(90vw, 400px);
}

.auth-box h2 {
    color: #1ac0a7;
    margin-top: 0;
    font-size: 1.5em;
    text-shadow: 0 0 10px rgba(26, 192, 167, 0.5);
}

.auth-box input {
    width: 100%;
    padding: 12px;
    margin: 20px 0;
    background-color: #050914;
    border: 1px solid #177062;
    border-radius: 4px;
    color: #80ffe5;
    font-size: 1.1em;
    text-align: center;
    outline: none;
    transition: border-color 0.3s;
}

.auth-box input:focus {
    border-color: #1ac0a7;
    box-shadow: 0 0 8px rgba(26, 192, 167, 0.4);
}

/* Conteneur principal des projets (masqué par défaut) */
#main-content {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
    padding: 20px;
}

h1.portal-title {
    color: #1ac0a7;
    font-size: clamp(22px, 4vw, 36px);
    text-align: center;
    margin-bottom: 30px;
    text-shadow: 0 0 15px rgba(26, 192, 167, 0.4);
}

/* Boutons Matrix Bleu */
.button {
    display: inline-block;
    border-radius: 4px;
    background: linear-gradient(135deg, #0d4d42 0%, #1ac0a7 100%);
    border: 1px solid #1ac0a7;
    color: #FFFFFF;
    text-align: center;
    font-size: clamp(16px, 3vw, 22px);
    padding: clamp(14px, 2.5vw, 18px) clamp(20px, 4vw, 30px);
    width: min(90vw, 450px);
    transition: all 0.3s ease;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(128, 255, 229, 0.2);
    text-decoration: none;
    font-weight: bold;
}

.button:hover {
    background: linear-gradient(135deg, #126b5d 0%, #33d1b9 100%);
    box-shadow: 0 6px 20px rgba(26, 192, 167, 0.6), inset 0 0 15px rgba(128, 255, 229, 0.4);
    transform: translateY(-2px);
    color: #e0fffb;
}

/* Lien discret bas de page */
.credits-link {
    position: fixed;
    bottom: 15px;
    right: 20px;
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.8em;
    text-decoration: none;
    transition: color 0.3s;
}

.credits-link:hover {
    color: #1ac0a7;
    text-decoration: underline;
}

.error-msg {
    color: #ff4d4d;
    font-size: 0.9em;
    margin-top: -10px;
    display: none;
}
</style>
<script src="title-scroll.js" data-start="5000" data-speed="250"></script>
</head>

<body>

    <!-- Écran de connexion / Mot de passe -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>Accès Sécurisé</h2>
            <p style="color: #a0c4df; font-size: 0.9em;">Veuillez entrer le mot de passe pour accéder au portail.</p>
            <input type="password" id="password-input" placeholder="Mot de passe" onkeypress="checkEnter(event)">
            <div id="error-msg" class="error-msg">Mot de passe incorrect</div>
            <button class="button" style="width: 100%; padding: 10px; font-size: 1em;" onclick="verifyPassword()">Valider</button>
        </div>
    </div>

    <!-- Contenu principal du Hub -->
    <div id="main-content">
        <h1 class="portal-title">Portail des Projets</h1>

        <!-- Boutons de navigation vers les projets -->
        <a href="escape_game/index.html" class="button">Escape Game</a>
        <a href="jeunes_reporters/index.html" class="button">Jeunes reporters pour l'environnement</a>
        <a href="la_parole_est_une_voix/index.html" class="button">La parole est une voix</a>
        <a href="hack_party/index.html" class="button">Hack Party</a>
         <a href="reflex/index.html" class="button">Reflex</a>
    </div>

    <!-- Crédits discrets -->
    <a href="javascript:void(0);" class="credits-link">David Ferreira (CO Driez / SEM Lab)</a>

    <script>
        // Remplace "ton_mot_de_passe" par le mot de passe de ton choix
        const PASSWORD_HASH = "motdepasse123"; 

        function verifyPassword() {
            const inputVal = document.getElementById("password-input").value;
            const errorDiv = document.getElementById("error-msg");

            if (inputVal === PASSWORD_HASH) {
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("main-content").style.display = "flex";
            } else {
                errorDiv.style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }

        function checkEnter(event) {
            if (event.key === "Enter") {
                verifyPassword();
            }
        }
    </script>
</body>
</html>
