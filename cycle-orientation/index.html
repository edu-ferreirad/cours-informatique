<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cycle d'Orientation</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding-top: 50px; 
            background-color: black; 
            height: 100vh;
            overflow: hidden;
        }
        .btn { 
            display: block; 
            width: 200px; 
            margin: 10px auto; 
            padding: 15px; 
            background-color: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            position: relative;
            z-index: 10;
        }
        .btn:hover { background-color: #0056b3; }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        h1, p {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
        }

        .retour {
            position: relative;
            z-index: 10;
            color: #4da6ff;
            text-decoration: none;
        }
        .retour:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Animation Matrix -->
    <canvas id="matrixCanvas"></canvas>

    <h1>Cycle d'Orientation</h1>
    <p>Choisissez votre niveau :</p>
    
    <a class="btn" href="9eme/">9ème</a>
    <a class="btn" href="10eme/">10ème</a>
    <a class="btn" href="11eme/">11ème</a>
    <a class="btn" href="cours-fac/">Cours FAC</a>
    
    <br>
    <a class="retour" href="../index.html">⬅ Retour accueil</a>

    <!-- Script Matrix Bleu (clair, normal, foncé) -->
    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const katakana = 'アァカサタナハマヤラワガザダバパイィキシチニヒミリヲギジヂビピウゥクスツヌフムユルグズブプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨロヲゴゾドボポヴッン';
        const nums = '0123456789';
        const alphabet = katakana + nums;

        const fontSize = 16;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        // Palette de bleus (clair, normal, foncé)
        const blueShades = ['#00ffff', '#007bff', '#001a33'];

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                ctx.fillStyle = blueShades[Math.floor(Math.random() * blueShades.length)];
                
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 30);
    </script>
</body>
</html>
