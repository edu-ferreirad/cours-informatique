<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ECG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* Canvas pour l'effet Matrix en arrière-plan */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
            margin-top: 50px;
        }

        .btn {
            display: block;
            width: 200px;
            margin: 10px auto;
            padding: 15px;
            background-color: rgba(0, 123, 255, 0.8);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: rgba(0, 86, 179, 0.9);
        }

        a.back-link {
            color: #007bff;
            text-decoration: none;
        }

        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="content">
        <h1>Espace ECG</h1>
        <p>Choisissez votre niveau :</p>
        
        <!-- Boutons vers les futures pages des années du collège -->
        <a class="btn" href="1ere/">1ère année</a>
        <a class="btn" href="2eme/">2ème année</a>
        <a class="btn" href="projets/">Projets</a>
        
        <br><br>
        <a class="back-link" href="../index.html">⬅ Retour à l'accueil général</a>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // Ajuster la taille du canvas à la fenêtre
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Caractères utilisés pour l'effet Matrix (mélange de chiffres, lettres et symboles)
        const characters = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz@#$%&*+<>?";
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);

        // Tableau pour stocker la position Y de chaque colonne
        let drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            // Effet de traînée en appliquant un fond semi-transparent noir à chaque frame
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Couleur rouge pour les caractères Matrix
            ctx.fillStyle = '#FF0000';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                // Choisir un caractère aléatoire
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                
                // Dessiner le caractère
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Réinitialiser la goutte en haut de l'écran de manière aléatoire une fois qu'elle est en bas
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        // Lancer l'animation (environ 30 images par seconde)
        setInterval(drawMatrix, 33);
    </script>
</body>
</html>
